name = "quantum-meteor"
main = "worker.js"
compatibility_date = "2024-07-01"

# Pinned to the account that owns the qsmoke workers.dev subdomain (the one
# the CYD devices call). The same Cloudflare login has three accounts and
# non-interactive deploys fail without this. Do NOT change to another account.
account_id = "76404a896503482bef751490312298d2"

# Free tier: 100,000 requests/day — more than enough
# Deploy with: npx wrangler deploy
# Your endpoint will be: https://quantum-meteor.<your-subdomain>.workers.dev/fireballs

# /grid 24 h history — one sample per ~10 min (144 writes/day, under KV's
# free-tier 1,000 writes/day). Key: hist:v1, rolling 24 h, trimmed in code.
[[kv_namespaces]]
binding = "GRID_HISTORY"
id = "e1ffc0cc6e31496bb2af3fece9725594"

# Samples history even when the CYD is asleep. Free-plan crons are allowed.
[triggers]
crons = ["*/10 * * * *"]
